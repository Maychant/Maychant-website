<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 640" fill="none" role="img" aria-label="A lively neighborhood of independent businesses" aria-describedby="neighborhood-desc">
  <desc id="neighborhood-desc">A cobalt café steps forward between a navy record shop and a white repair workshop, each set at a different angle. An older owner waves from the café, with plants, café chairs and a bicycle along the stepped street.</desc>
